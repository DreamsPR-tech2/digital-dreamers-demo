<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREAMS Inclusive Early Learning Framework™ · Experiencia docente · We Are Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2E86D1; --blue-d:#1D4ED8; --red:#E63946; --yellow:#FFC20E; --ink:#2B2B2B; --navy:#2A3D66; --canvas:#F6F6F6; --mist:#D7E6F3; --sand:#F0E6D2; --seafoam:#A8DCC3; --apricot:#FFC191;
  --teal:#1FA594; --gold:#B8780A; --plum:#7A4FBF; --green:#3FA35B;
  --blue-soft:#E8F2FB; --teal-soft:#E3F5F2; --gold-soft:#FFF6D6; --red-soft:#FDEAEC; --plum-soft:#F0EAF9;
  --ink-2:#2A3D66; --ink-3:#5A6572; --line:#E1E6EB; --card:#fff; --bg:var(--canvas);
  --ok:#1FA594; --ok-soft:#E3F5F2; --sup:#B8780A; --sup-soft:#FFF6D6; --no:#5A6572; --no-soft:#EEF1F4;
  --s-reg:#7A4FBF; --s-reg-soft:#F0EAF9; --s-con:#2E86D1; --s-con-soft:#E8F2FB; --s-move:#1FA594; --s-move-soft:#E3F5F2;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(42,61,102,.04),0 8px 24px -16px rgba(42,61,102,.25);
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;font-size:calc(16px*var(--fs));overscroll-behavior:none}
body.size-lg{--fs:1.14} body.size-xl{--fs:1.3}
body.contrast{--bg:#fff;--card:#fff;--line:#0f1a33;--ink:#000;--ink-2:#000;--ink-3:#222;--shadow:none;--blue-soft:#fff;--teal-soft:#fff;--gold-soft:#fff;--plum-soft:#fff;--no-soft:#fff}
body.contrast .card,body.contrast .chip,body.contrast .opt{border-width:2px}
body.motion *{transition:none!important;animation:none!important}
body.quiet{--bg:#F3F4F6}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;min-height:44px}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.15}
h1{font-size:1.9em;font-weight:800;letter-spacing:-.4px} h2{font-size:1.35em;font-weight:800} h3{font-size:1.05em;font-weight:700} h4{font-size:.95em;font-weight:700}
.fred{font-weight:700}
p{margin:0}
textarea,input{font:inherit;color:var(--ink)}

/* header */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;margin-right:auto;min-height:44px}
.logo img{height:38px;width:auto;display:block}
.logo .sub{font-size:11.5px;color:var(--ink-2);border-left:1px solid var(--line);padding-left:12px;line-height:1.3;font-weight:600;max-width:210px}
@media(max-width:900px){.logo .sub{display:none}}
.badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);border:1px solid #ead9b0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:40px}
.seg button.on{background:var(--blue);color:#fff}
.icnbtn{width:44px;height:44px;border-radius:12px;background:var(--canvas);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--navy)}
.icnbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:13px;background:#fff;min-height:40px}

main{max-width:1280px;margin:0 auto;padding:18px 18px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--ink-3);font-size:.88em}
.tiny{font-size:.78em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.lead{color:var(--ink-2);font-size:1em;max-width:760px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;font-size:1em;background:var(--blue);color:#fff;transition:transform .08s,filter .15s;min-height:48px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.teal{background:var(--teal)} .btn.plum{background:var(--plum)} .btn.gold{background:var(--gold)} .btn.ink{background:var(--ink)}
.btn.sm{padding:8px 14px;font-size:.88em;min-height:40px}
.btn.big{font-size:1.1em;padding:14px 24px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.78em;font-weight:600;background:var(--no-soft);color:var(--ink-2);border:1px solid transparent;min-height:0}
.chip.blue{background:var(--blue-soft);color:#1b4f93} .chip.teal{background:var(--teal-soft);color:#0b5c50} .chip.gold{background:var(--gold-soft);color:#6a4300} .chip.plum{background:var(--plum-soft);color:var(--plum)} .chip.red{background:var(--red-soft);color:#8a1a24}
.chip.ok{background:var(--ok-soft);color:#0b5c50} .chip.sup{background:var(--sup-soft);color:#6a4300} .chip.no{background:var(--no-soft);color:var(--no)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:.92em;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* teacher nav */
.tnav{display:flex;gap:4px;flex-wrap:wrap}
.tnav button{padding:8px 14px;border-radius:8px;font-weight:700;font-size:.9em;color:var(--navy);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.tnav button.on{background:var(--mist);color:var(--blue)}


/* roster */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{padding:14px 16px}
.tile .k{font-size:.8em;color:var(--ink-3);font-weight:600}
.tile .v{font-size:1.9em;font-weight:800;letter-spacing:-.5px;margin-top:2px;color:var(--ink);line-height:1.1}
.tile .v small{font-size:.5em;font-weight:600;color:var(--ink-3);margin-left:4px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.kid{text-align:left;padding:14px;border-radius:18px;background:#fff;border:1.5px solid var(--line);display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;box-shadow:var(--shadow)}
.kid .av{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.1em}
.kid .nm{font-weight:800;font-size:1.05em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kid .nm .star{font-size:.7em;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 8px;font-weight:700}
.kid .ln{font-size:.82em;color:var(--ink-2);margin:2px 0 6px}
.kid .chips{display:flex;flex-wrap:wrap;gap:4px}
.kid .mini{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:.78em;color:var(--ink-3)}
.bar{height:9px;border-radius:999px;background:var(--no-soft);overflow:hidden;display:flex;flex:1;min-width:60px;gap:2px}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .sup{background:var(--sup)} .bar .no{background:#C9D0DC}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8em;color:var(--ink-2);font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* classroom table */
.ct{width:100%;border-collapse:collapse;font-size:.84em}
.ct th{text-align:left;font-size:.7em;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:12px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.ct td{padding:9px 5px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.ct td:first-child{white-space:normal;min-width:190px;max-width:230px}
.ct th{padding:12px 5px;font-size:.66em}
.ct .chip{font-size:.78em;padding:4px 8px}
.ct tr:last-child td{border-bottom:0}
.ct tr.live td{background:#FBFCFE}
.ct .who{display:flex;align-items:center;gap:12px}
.ct .who b{font-size:1.05em;display:block}
.pb{display:inline-block;width:42px;height:10px;border-radius:999px;background:#E6EAF2;overflow:hidden;vertical-align:middle;margin-right:8px}
.pb i{display:block;height:100%;border-radius:999px}
.pb+b{font-size:.95em}
.ct .bar{min-width:44px;max-width:60px}
.pb .g{background:var(--teal)} .pb .a{background:var(--gold)} .pb .r{background:var(--red)} .pb .b{background:var(--blue)} .pb .p{background:var(--plum)}
.ct td b{font-weight:800}
.namebtn{text-align:left;padding:4px 6px;border-radius:12px;min-height:44px;display:block;width:100%;color:var(--ink)}
.namebtn b{font-size:1.1em;display:block;color:var(--blue);text-decoration:underline;text-decoration-color:rgba(15,93,184,.35);text-underline-offset:3px}
.namebtn:active{background:var(--blue-soft)}
/* plan accordion */
.stepcard{border-radius:22px;border:2px solid var(--sc);background:#fff;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.stepcard.reg{--sc:var(--s-reg);--ss:var(--s-reg-soft)} .stepcard.con{--sc:var(--s-con);--ss:var(--s-con-soft)} .stepcard.move{--sc:var(--s-move);--ss:var(--s-move-soft)}
.stephead{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--ss);width:100%;text-align:left}
.stephead .num{width:44px;height:44px;border-radius:50%;background:var(--sc);color:#fff;display:grid;place-items:center;font-family:Poppins,sans-serif;font-weight:700;font-size:1.3em;flex:none}
.stephead .t{font-family:Poppins,sans-serif;font-weight:700;font-size:1.35em;color:var(--sc);line-height:1.1}
.stephead .t small{display:block;font-family:Poppins,sans-serif;font-weight:600;font-size:.6em;color:var(--ink-2)}
.stephead .time{margin-left:auto;font-weight:700;color:var(--sc);background:#fff;border-radius:999px;padding:6px 12px;font-size:.85em;white-space:nowrap}
.stephead .car{font-size:1.2em;color:var(--sc);transition:transform .2s}
.stepcard.open .stephead .car{transform:rotate(180deg)}
.stepbody{display:none;padding:16px 18px 18px}
.stepcard.open .stepbody{display:block}
.acts{display:grid;gap:10px}
.act{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--canvas);border:1px solid var(--line)}
.act .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:1.3em;border:1px solid var(--line)}
.act b{display:block;font-size:.98em}
.act .s{font-size:.86em;color:var(--ink-2);margin-top:2px}
.act .s em{color:var(--ink);font-style:italic}
.act .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--sc);color:var(--sc);font-weight:700;font-size:.82em;min-height:36px}
.dd{margin-top:12px;border:1px dashed var(--line);border-radius:14px;overflow:hidden}
.dd>button{width:100%;text-align:left;padding:10px 14px;font-weight:700;font-size:.88em;display:flex;align-items:center;gap:8px;color:var(--ink-2);background:#fff}
.dd>button .car{margin-left:auto;transition:transform .2s}
.dd.open>button .car{transform:rotate(180deg)}
.dd .ddb{display:none;padding:4px 14px 14px;font-size:.88em;color:var(--ink-2);background:#fff}
.dd.open .ddb{display:block}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.lvl div{background:var(--canvas);border-radius:12px;padding:10px;font-size:.92em}
.lvl b{display:block;font-size:.8em;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
@media(max-width:700px){.lvl{grid-template-columns:1fr}}
.mats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mats span{padding:5px 10px;border-radius:10px;background:var(--canvas);border:1px solid var(--line);font-size:.84em;font-weight:600}

/* live lesson */
.live{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
@media(max-width:900px){.live{grid-template-columns:1fr}}
.stepper{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stepper button{flex:1;min-width:150px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink-2)}
.stepper button .n{width:30px;height:30px;border-radius:50%;background:var(--canvas);display:grid;place-items:center;font-size:.85em;flex:none}
.stepper button.on{border-color:var(--sc);color:var(--sc);background:var(--ss)} .stepper button.on .n{background:var(--sc);color:#fff}
.stepper button.done .n{background:var(--teal);color:#fff}
.stepper button.reg{--sc:var(--s-reg);--ss:var(--s-reg-soft)} .stepper button.con{--sc:var(--s-con);--ss:var(--s-con-soft)} .stepper button.move{--sc:var(--s-move);--ss:var(--s-move-soft)}
.checkitem{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fff}
.checkitem .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.checkitem .h b{font-size:.95em}
.checkitem .h .cnt{margin-left:auto;font-size:.8em;color:var(--ink-3);font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.kbtn{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:.82em;text-align:left;min-height:44px;color:var(--ink)}
.kbtn .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8em;flex:none;background:var(--no-soft);color:var(--no)}
.kbtn.ok{border-color:var(--ok);background:var(--ok-soft)} .kbtn.ok .st{background:var(--ok);color:#fff}
.kbtn.sup{border-color:var(--sup);background:var(--sup-soft)} .kbtn.sup .st{background:var(--sup);color:#fff}
.kbtn.no{border-color:#B8C1D1;background:#fff} .kbtn.no .st{background:#B8C1D1;color:#fff}
.kbtn .src{margin-left:auto;font-size:.8em}
.keyrow{display:flex;gap:10px;flex-wrap:wrap;font-size:.8em;color:var(--ink-2);font-weight:600;margin:4px 0 12px}
.keyrow span{display:inline-flex;align-items:center;gap:5px}
.keyrow i{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:.75em;color:#fff}
.content-pane{border-radius:22px;border:2px solid var(--sc);background:#fff;overflow:hidden}
.content-pane .cph{background:var(--sc);color:#fff;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:10px}
.content-pane .cph small{font-weight:500;opacity:.9}
.content-pane .cpb{padding:16px}
.content-pane.reg{--sc:var(--s-reg)} .content-pane.con{--sc:var(--s-con)} .content-pane.move{--sc:var(--s-move)}
.script{background:var(--canvas);border-left:4px solid var(--sc);border-radius:0 12px 12px 0;padding:10px 14px;font-size:.92em;margin:8px 0}
.script .es{color:var(--ink-2);font-style:italic;display:block;margin-top:2px}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:25;padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:1280px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* word cards & book */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.wcard{border:3px solid var(--wc,var(--blue));border-radius:20px;padding:14px 12px;text-align:center;background:#fff}
.wcard .pic{font-size:3.2em;line-height:1}
.wcard .en{font-family:Poppins,sans-serif;font-weight:700;font-size:1.7em;color:var(--wc,var(--blue));margin-top:4px}
.wcard .es{font-weight:700;color:var(--ink-2)}
.wcard .g{font-size:.78em;color:var(--ink-3);margin-top:6px;line-height:1.3}
.wcard .snd{display:inline-block;margin-top:6px;font-size:.78em;font-weight:800;background:var(--canvas);border-radius:999px;padding:3px 9px}
.page{border:3px solid var(--blue);border-radius:24px;overflow:hidden;background:#fff}
.page .scene{background:linear-gradient(180deg,#CFE8FF 0,#E8F6FF 55%,#CDEBC7 55%,#B9E3B0 100%);min-height:220px;display:grid;place-items:center;font-size:4.5em;letter-spacing:.1em;position:relative}
.page .scene .pg{position:absolute;top:10px;left:14px;font-size:.25em;font-weight:800;background:#fff;border-radius:999px;padding:3px 10px;color:var(--ink)}
.page .txt{padding:16px 18px}
.page .txt .en{font-family:Poppins,sans-serif;font-size:1.35em;font-weight:600;line-height:1.3}
.page .txt .en b{color:var(--blue)}
.page .txt .es{font-size:1.02em;color:var(--ink-2);margin-top:6px;line-height:1.4}
.page .txt .es b{color:var(--red)}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.wings{display:grid;gap:10px}
.wing{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.wing .ic{width:46px;height:46px;border-radius:14px;background:var(--teal-soft);display:grid;place-items:center;font-size:1.4em}
.wing b{font-size:1em} .wing .seq{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.wing .seq span{padding:4px 10px;border-radius:999px;font-size:.78em;font-weight:700;color:#fff}
.wing .seq .r{background:var(--gold)} .wing .seq .m{background:var(--teal)} .wing .seq .s{background:var(--red)}
.wing .meta{font-size:.82em;color:var(--ink-2)}
.fn{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:0 auto}
.fn .pocket{border:3px dashed var(--blue);border-radius:20px;padding:14px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.fn .pocket .lab{font-family:Poppins,sans-serif;font-weight:700;font-size:1.3em;color:var(--blue)}
.fn .pocket .lab.red{color:var(--red)}
.fn .pocket .av{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.4em}
.poster{display:flex;gap:10px;justify-content:center;margin-top:12px}
.poster span{flex:1;text-align:center;border-radius:14px;padding:10px;font-weight:800;color:#fff;font-size:.9em}

/* big 5 screening */
.b5grid{width:100%;border-collapse:separate;border-spacing:4px;font-size:.86em}
.b5grid th{font-weight:700;color:var(--ink-3);font-size:.76em;padding:4px;text-align:center;vertical-align:bottom;line-height:1.2}
.b5grid th:first-child,.b5grid td:first-child{text-align:left;white-space:nowrap;font-weight:700;padding-left:4px}
.b5grid td{text-align:center;padding:0}
.b5grid td button{width:100%;height:40px;border-radius:10px;font-weight:800;min-height:40px;display:grid;place-items:center;line-height:1}
.b5grid td button small{font-size:.62em;font-weight:600;opacity:.85}
.lv1{background:#EAF0FA;color:#1b4f93} .lv2{background:#BFD4F2;color:#143c73} .lv3{background:#6F9BDA;color:#fff} .lv4{background:#0F5DB8;color:#fff} .lv0{background:var(--canvas);color:#B8C1D1}
.b5dots{display:inline-flex;gap:3px;vertical-align:middle}
.b5dots i{width:12px;height:12px;border-radius:3px;display:inline-block}

@media print{#hdr,.noprint,.bottombar,.toast,.panel,footer{display:none!important}body{background:#fff}main{padding:0;max-width:none}.report{border:0;box-shadow:none;padding:0;max-width:none;page-break-after:always;margin-bottom:0}.report:last-child{page-break-after:auto}}
.report+.report{margin-top:18px}
.levelbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#E6EAF2;gap:2px}
.levelbar i{display:block;height:100%}
/* student 9-box walk */
.walk{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.walk span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8em;background:#fff;border:2px solid var(--line);color:var(--ink-3)}
.walk span.on{border-color:var(--bc);background:var(--bc);color:#fff} .walk span.done{border-color:var(--teal);color:var(--teal)}
.greet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:0 auto}
.magnet{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:1.05em;text-align:left;min-height:56px}
.magnet.on{border-color:var(--green);background:#E6F5EA}
.magnets{display:grid;gap:8px;max-width:520px;margin:0 auto}
.pledge{background:var(--navy);color:#fff;border-radius:16px;padding:22px;text-align:center;font-size:1.15em;font-weight:700;line-height:1.5}

/* v17 · board box mini panel in the plan / today drop-downs (mirrors the live board) */
.pcols{grid-template-columns:1fr 1.15fr}
.bm{border:3px solid var(--bc);border-radius:16px;overflow:hidden;background:#fff;font-family:Poppins,sans-serif}
.bm .bmh{display:flex;align-items:center;gap:8px;background:var(--bc);color:#fff;padding:6px 8px 6px 10px}
.bm .bmh b{font-size:.95em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .bmn{width:24px;height:24px;border-radius:50%;background:#FFC20E;color:#2B2B2B;display:grid;place-items:center;font-weight:800;font-size:.85em;flex:none}
.bm .bmo{display:inline-flex;align-items:center;gap:5px;border:1.5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:3px 10px;font:700 .74em Poppins,sans-serif;min-height:30px;white-space:nowrap;flex:none}
.bm .bmb{padding:9px 10px 10px;background:linear-gradient(180deg,var(--bl),#fff 75%);display:flex;flex-direction:column;gap:7px;font-size:.84em;color:#2A3D66}
.bm.skipped .bmb{background:repeating-linear-gradient(135deg,#fff 0 14px,#F1F3F6 14px 28px)}
.bmlab{font-weight:800;font-size:.8em;letter-spacing:.04em;text-transform:uppercase;color:var(--bc)}
.bmbub{align-self:flex-start;border:2.5px solid var(--bc);border-radius:14px;background:#fff;padding:3px 12px;font-weight:700;color:var(--bc);font-size:1.05em;line-height:1.15}
.bmbub small,.bmcard small,.bmvid small,.bmmag small{display:block;font-weight:500;font-size:.78em;color:#5A6572}
.bmfaces{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bmface{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.78em;text-align:center;line-height:1.1}
.bmface img{height:46px;width:auto;object-fit:contain;margin-bottom:2px}
.bmfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#F6F6F6;border-radius:10px;padding:4px 8px;font-weight:700;font-size:.84em}
.bmfoot i{width:6px;height:6px;border-radius:50%;background:var(--bc);display:inline-block}
.bmgreen{display:grid;grid-template-columns:1fr 1fr;gap:5px;border:2.5px solid var(--bc);border-radius:12px;padding:6px;background:#fff}
.bmmag{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:9px;padding:4px 7px;font-weight:700;line-height:1.1;background:#fff}
.bmmag i{width:10px;height:10px;border-radius:50%;background:var(--bc);flex:none}
.bmmag.maybe{border-style:dashed}.bmmag.maybe i{background:#fff;border:2px solid var(--bc)}
.bmtrio{height:84px;width:auto;align-self:center;object-fit:contain}
.bmvid{display:flex;align-items:center;gap:8px;border:2px solid var(--bc);border-radius:10px;background:#fff;padding:4px 8px;line-height:1.15}
.bmvid b{font-weight:700}
.bmplay{width:24px;height:24px;border-radius:50%;background:var(--bc);display:grid;place-items:center;flex:none}
.bmrow{display:grid;grid-template-columns:1fr 1fr;gap:5px}.bmrow.three{grid-template-columns:repeat(3,1fr)}
.bmcard{border:2px solid var(--bc);border-radius:10px;background:#fff;padding:4px 6px;text-align:center;line-height:1.15;font-weight:700}
.bmsnds{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bmsnd{border:2.5px solid var(--sc);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:3px 2px;line-height:1.05}
.bmsnd b{font-size:1.35em;font-weight:800;color:var(--sc)}.bmsnd img{width:34px;height:34px}.bmsnd span{font-weight:600;font-size:.82em}
.bmwds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bmwd{border:1.5px solid var(--line);border-radius:9px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:3px 2px}
.bmwd img{width:30px;height:30px}.bmwd b{font-weight:700;font-size:.92em}
.bmbook{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.bmbook img{width:118px;height:auto;border-radius:8px;border:2px solid var(--bc)}
.bmsteps{display:flex;flex-direction:column;gap:4px}
.bmsteps div{display:flex;gap:6px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:3px 6px;font-weight:600;line-height:1.15}
.bmsteps span{width:18px;height:18px;border-radius:50%;background:var(--bc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8em;flex:none}
.bmpages{display:flex;flex-wrap:wrap;gap:4px}
.bmpages span{background:#fff;border:1.5px solid var(--bc);border-radius:999px;padding:1px 8px;font-weight:600;font-size:.82em}
.bmframes{display:flex;flex-direction:column;gap:4px}
.bmframes div{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--bc);border-radius:9px;padding:3px 8px;font-weight:700}
.bmframes i{flex:1;border-bottom:2px dashed #8A94A3;height:10px}
.bmskip{align-self:center;border:2.5px dashed #8A94A3;border-radius:10px;background:#fff;padding:2px 12px;font-weight:800;color:#5A6572;transform:rotate(-3deg)}
.bmwing{font-weight:700;text-align:center;background:#fff;border-radius:10px;padding:4px 8px;border:1.5px solid var(--line)}
.bmex{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bmexc{position:relative;border:2px solid var(--bc);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 3px;text-align:center;line-height:1.1}
.bmexc b{font-weight:700;font-size:.8em}
.bmexn{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--bc);color:#fff;font-weight:800;font-size:.75em;display:grid;place-items:center}
.bmexi{display:flex;justify-content:center;align-items:flex-end;height:58px;margin-top:10px}.bmexi img{height:56px;width:auto;object-fit:contain}
.bmcalm{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--bc);border-radius:999px;padding:3px 10px;font-size:.92em}
.bmcalm i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,var(--bc) 32%);flex:none}
/* board images in the lesson views */
.scene .scimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene{overflow:hidden}
.bfimg{height:1.6em;width:auto;object-fit:contain}
.bigtiles.five{grid-template-columns:repeat(5,1fr)}.bigtiles.four{grid-template-columns:repeat(4,1fr)}
.bt .ic.exi{display:flex;gap:2px;justify-content:center}.bt .ic.exi img{height:2.3em;width:auto}
.bptrio{display:block;height:120px;width:auto;margin:0 auto 6px}
.wing .exthumbs{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.wing .exrow{display:flex;gap:6px;align-items:center}.wing .exrow small{width:64px;font-weight:700;color:var(--ink-2)}
.wing .exf{display:flex;flex-direction:column;align-items:center;font-size:.75em;font-weight:600;width:76px;text-align:center}
.wing .exf img{height:64px;width:auto;object-fit:contain}.wing .exf i{font-style:normal}
@media(max-width:760px){.pcols{grid-template-columns:1fr}}
</style>
</head>

function load(){try{const j=JSON.parse(localStorage.getItem('dreams-te-v1')||'null');if(j&&j.S){S={...DEF(),...j.S};if(!S.b5c)S.b5c={i:S.b5||{},m:{},e:{}};if(S.dv!==DATA_V){['i','m','e'].forEach(c=>{const o=S.b5c[c]||{};Object.keys(o).forEach(id=>{if(!String(id).startsWith('live-'))delete o[id]});S.b5c[c]=o});S.dv=DATA_V}Object.assign(UI,j.UI||{})}}catch(e){}}
function resetAll(){for(let i=KIDS.length-1;i>=0;i--)if(KIDS[i].live){delete KID[KIDS[i].id];KIDS.splice(i,1)}S=DEF();UI.lang='en';try{localStorage.removeItem('dreams-te-v1')}catch(e){}applyUI();render();toast(UI.lang==='es'?'Demo reiniciada':'Demo restarted')}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function speak(txt,lang){if(!UI.speak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/<[^>]+>/g,''));u.lang=lang==='en'?'en-US':'es-PR';u.rate=.92;speechSynthesis.speak(u)}catch(e){}}

function getR(kid,item){return (S.resp[kid]||{})[item]||null}

function simulateKid(k,force){const r=rng(hash(k.id+'-nov10'));ITEMS.forEach(it=>{if(!force&&getR(k.id,it.id))return;const[p1,p2]=k.p[pkey(it.id)]||(it.b5&&B5P[k.id]?[B5P[k.id][it.b5],.3]:[.6,.3]);const x=r();setR(k.id,it.id,x<p1?'ok':x<p1+p2?'sup':'no','sim')});if(S.feel[k.id]==null)S.feel[k.id]=k.feel}
function simulateAll(){KIDS.forEach(k=>{if(k.live)return;if(S.src[k.id]&&Object.values(S.src[k.id]).includes('learner'))return;simulateKid(k)});save()}
function counts(itemId){const c={ok:0,sup:0,no:0,n:0};KIDS.forEach(k=>{const v=getR(k.id,itemId);if(v){c[v]++;c.n++}});return c}
function kidSummary(kid){const c={ok:0,sup:0,no:0,n:0};ITEMS.forEach(it=>{const v=getR(kid,it.id);if(v){c[v]++;c.n++}});return c}

/* ---- Big 5 / ELOF screening helpers · three checkpoints (i = Inicial, m = Intermedio, e = Fin de año) ---- */
const CPS=['i','m','e'];const CPL=cp=>({i:t('cp_i'),m:t('cp_m'),e:t('cp_e')})[cp];
function getB5(kid,item,cp){cp=cp||'i';return ((S.b5c[cp]||{})[kid]||{})[item]||null}
function setB5(kid,item,patch,cp){cp=cp||S.b5cp||'i';S.b5c[cp]=S.b5c[cp]||{};S.b5c[cp][kid]=S.b5c[cp][kid]||{};S.b5c[cp][kid][item]={...(S.b5c[cp][kid][item]||{s:null,l:null,sup:null,p:null,n:''}),...patch};save()}
function simulateB5(){KIDS.forEach(k=>{if(k.live||S.b5c.i[k.id])return;const r=rng(hash(k.id+'-b5'+(SALT[k.id]||'')));SITEMS.forEach(it=>{const b=B5OF(it.id);const base=b?(B5P[k.id]||{})[b]??.6:(it.d==='PMP'&&k.id==='diego'?.3:it.d==='ATL'||it.d==='SE'?(k.p.reg[0]+k.p.turn[0])/2:.6);const x=r();let s=x<base?2:x<base+.28?1:0;if(b==='pa')s=base<.3?0:base<.6?1:2;let p=r()<.05?'partial':'full';if(r()<.03){p='declined';s=null}const sup=s===2?(r()<.8?'I':'V'):s===1?(r()<.5?'V':'M'):(r()<.5?'M':'F');const l=k.modes.includes('aac')?(r()<.6?'aac':'gest'):k.modes.includes('sign')&&r()<.4?'gest':k.home==='bi'?'both':k.home==='en'?(r()<.8?'en':'both'):(r()<.75?'es':'both');setB5(k.id,it.id,{s,l:s==null?null:l,sup:s==null?null:sup,p,n:''},'i');
   /* simulated later checkpoints for the demo: growth from the baseline */
   const grow=(prev,pr)=>{if(!prev||prev.s==null)return {s:r()<.6?1:0,l,sup:'V',p:'full',n:''};const s2=Math.min(2,prev.s+(r()<pr?1:0));return {s:s2,l,sup:s2===2?(r()<.85?'I':'V'):(r()<.5?'V':'M'),p:'full',n:''}};const mv=grow(getB5(k.id,it.id,'i'),.45);setB5(k.id,it.id,mv,'m');setB5(k.id,it.id,grow(mv,.5),'e')})});save()}
function domLevel(kid,domId,cp){const ids=B5MAP[domId];let sum=0,app=0,obs=0,emg=0;ids.forEach(id=>{const v=getB5(kid,id,cp);if(!v||v.s==null||v.p==='declined')return;app++;sum+=v.s;if(v.s===2)obs++;else if(v.s===1)emg++});if(!app)return {obs,emg,app,lv:0,pct:0};const pct=Math.round(100*sum/(2*app));const lv=pct<35?1:pct<60?2:pct<85?3:4;return {obs,emg,app,lv,pct}}
function elofDomScore(kid,dk,cp){const its=SITEMS.filter(i=>i.d===dk);let sum=0,app=0,rec=0;its.forEach(i=>{const v=getB5(kid,i.id,cp);if(v&&(v.s!=null||v.p==='declined'))rec++;if(!v||v.s==null||v.p==='declined')return;app++;sum+=v.s});return {rec,n:its.length,pct:app?Math.round(100*sum/(2*app)):null}}
function domEvidence(domId){const its=ITEMS.filter(i=>i.b5===domId);const c={ok:0,sup:0,no:0,n:0};its.forEach(it=>{const x=counts(it.id);c.ok+=x.ok;c.sup+=x.sup;c.no+=x.no;c.n+=x.n});return {items:its,c}}
function b5dots(kid,cp){return `<span class="b5dots" title="Big 5">${BIG5.map(d=>{const lv=domLevel(kid,d.id,cp).lv;return `<i style="background:${B5COLOR[d.id]};opacity:${lv?[0,.3,.55,.8,1][lv]:.12}" title="${L(d.n)} · ${lv||'—'}"></i>`}).join('')}</span>`}
function monthSeries(kid,domId){/* level 1–4 (continuous) per school month; Sep·Jan·May anchored to the checkpoints, other months interpolated with a little seeded noise */const a={1:domLevel(kid,domId,'i'),5:domLevel(kid,domId,'m'),9:domLevel(kid,domId,'e')};const v=o=>o.app?1+3*o.pct/100:null;const r=rng(hash(kid+domId+'-m'));const out=[];for(let i=0;i<10;i++){let val=null;if(i===0)val=null;else if(a[i])val=v(a[i]);else{const lo=i<5?1:5,hi=i<5?5:9;const vl=v(a[lo]),vh=v(a[hi]);if(vl!=null&&vh!=null){val=vl+(vh-vl)*(i-lo)/(hi-lo)+(r()-.5)*.3}}if(val!=null)val=Math.max(1,Math.min(4,val));out.push({i,m:MONTHS[i],v:val,rec:i<=NOW_M})}return out}
function classMonthSeries(domId){const per=KIDS.filter(k=>!k.live).map(k=>monthSeries(k.id,domId));return per[0].map((p,i)=>{const vs=per.map(s=>s[i].v).filter(v=>v!=null);return {i,m:p.m,v:vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null,rec:p.rec}})}
function b5chart(kid,opts){opts=opts||{};const W=680,H=260,PL=34,PR=16,PT=16,PB=34;const xs=i=>PL+(W-PL-PR)*i/9;const ys=v=>PT+(H-PT-PB)*(4-v)/3;const act=S.b5lines||{bk:true,ol:true,pa:true,ak:true,cp:true};
 let g='';[1,2,3,4].forEach(l=>{g+=`<line x1="${PL}" x2="${W-PR}" y1="${ys(l)}" y2="${ys(l)}" stroke="#E1E6EB"/><text x="${PL-10}" y="${ys(l)+4}" text-anchor="end" font-size="11" font-weight="800" fill="#5A6572">${l}</text>`});
 MONTHS.forEach((m,i)=>{g+=`<text x="${xs(i)}" y="${H-10}" text-anchor="middle" font-size="11" font-weight="${i===NOW_M?'800':'600'}" fill="${i===NOW_M?'#2A3D66':'#5A6572'}">${m[UI.lang]}</text>`});
 g+=`<line x1="${xs(NOW_M)}" x2="${xs(NOW_M)}" y1="${PT}" y2="${H-PB+4}" stroke="#2A3D66" stroke-dasharray="3 4" opacity=".5"/>`;
 BIG5.forEach(d=>{if(!act[d.id])return;const s=(kid==='class'?classMonthSeries(d.id):monthSeries(kid,d.id)).filter(p=>p.v!=null);const c=B5COLOR[d.id];const rec=s.filter(p=>p.rec),proj=s.filter(p=>!p.rec);const path=a=>a.map((p,i)=>(i?'L':'M')+xs(p.i).toFixed(1)+','+ys(p.v).toFixed(1)).join('');if(rec.length>1)g+=`<path d="${path(rec)}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;if(proj.length){const seg=[rec[rec.length-1],...proj].filter(Boolean);g+=`<path d="${path(seg)}" fill="none" stroke="${c}" stroke-width="2.5" stroke-dasharray="5 5" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>`}s.forEach(p=>{g+=`<circle cx="${xs(p.i)}" cy="${ys(p.v)}" r="${p.rec?5.5:4.5}" fill="${p.rec?c:'#fff'}" stroke="${c}" stroke-width="2.5"><title>${L(d.n)} · ${p.m[UI.lang]} · ${p.v.toFixed(1)}</title></circle>`})});
 const legend=`<div class="row" style="gap:6px;margin-bottom:8px">${BIG5.map(d=>`<button class="lgd ${act[d.id]?'on':''}" data-act="b5tog" data-v="${d.id}" style="--c:${B5COLOR[d.id]}"><i></i>${L(d.n)}</button>`).join('')}</div>`;
 const note=`<div class="tiny muted" style="margin-top:6px">● ${UI.lang==='es'?'registrado':'recorded'} · ○ ${UI.lang==='es'?'proyección de demo':'demo projection'} · ┆ ${UI.lang==='es'?'hoy':'today'}</div>`;
 return `${opts.noLegend?'':legend}<svg class="b5svg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Big 5 by month">${g}</svg>${note}`}

function spark(levels){/* levels: [{lv,pct,label,sim}] → inline SVG, one hue */const W=300,H=96,xs=[40,150,260];const y=lv=>lv?78-(lv-1)*17:null;const pts=levels.map((l,i)=>({x:xs[i],y:y(l.lv),...l}));const seg=pts.filter(p=>p.y!=null);let path='';seg.forEach((p,i)=>{path+=(i?'L':'M')+p.x+','+p.y});return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${levels.map(l=>l.label+': '+(l.lv||'—')).join(', ')}">${[1,2,3,4].map(v=>`<line x1="28" x2="${W-28}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EAF2" stroke-width="1"/><text x="10" y="${y(v)+4}" font-size="9" fill="#8A94A6" font-weight="700">${v}</text>`).join('')}<path d="${path}" fill="none" stroke="#0F5DB8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>p.y==null?`<circle cx="${p.x}" cy="78" r="5" fill="#fff" stroke="#C9D0DC" stroke-width="2" stroke-dasharray="2 2"/>`:`<circle cx="${p.x}" cy="${p.y}" r="7" fill="${p.sim?'#fff':'#0F5DB8'}" stroke="#0F5DB8" stroke-width="2.5"/><text x="${p.x}" y="${p.y-11}" text-anchor="middle" font-size="10" font-weight="800" fill="#1B2B59">${p.pct}%</text>`).join('')}${pts.map(p=>`<text x="${p.x}" y="${H-2}" text-anchor="middle" font-size="9.5" fill="#44506a" font-weight="700">${p.label}</text>`).join('')}</svg>`}

 if(bid==='exercise'){KIDS.filter(k=>['sup','no'].includes(R(k,'wings'))||k.id==='diego').forEach(k=>add(k,es?'opción sentada · adulto modela':'seated option · adult models'));KIDS.filter(k=>['sup','no'].includes(R(k,'turn'))).forEach(k=>add(k,es?'First/Next con traspaso del adulto':'First/Next with adult hand-off'))}

 <div class="two" style="margin-top:6px"><div><h2>${t('rep_today')} · We Are Friends</h2>${c.n?`<table><tbody>${ITEMS.map(it=>{const v=getR(k.id,it.id);return v?`<tr><td>${L(it.lab).split(' · ')[0].split(' (')[0]}</td><td style="white-space:nowrap">${ST_ICON[v]} ${v==='ok'?t('k_ok'):v==='sup'?t('k_sup'):t('k_no')}</td></tr>`:''}).join('')}</tbody></table><div class="tiny" style="margin-top:4px">${c.ok} ${t('k_ok').toLowerCase()} · ${c.sup} ${t('k_sup').toLowerCase()} · ${c.no} ${t('k_no').toLowerCase()} · ${t('group')}: ${lv?t('g_'+lv):'—'}</div>`:`<p>${t('none_yet')}</p>`}</div></div>
 <div class="two"><div><h2>${t('rep_sup')}</h2><ul style="margin:0;padding-left:18px;line-height:1.6">${k.sup.map(s=>`<li>${L(s)}</li>`).join('')}${a11yList(k).map(key=>`<li>${L(A11Y_LABEL[key])}</li>`).join('')}</ul>${!k.sup.length&&!a11yList(k).length?'<p>—</p>':''}</div><div><h2>${t('rep_next')}</h2>${plan&&plan.length?`<ul style="margin:0;padding-left:18px;line-height:1.6">${plan.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${UI.lang==='es'?'Sigue el plan del grupo.':'Follows the group plan.'}</p>`}</div></div>
 <h2>${t('rep_home')} · En casa</h2><p>${UI.lang==='es'?`Busquen <b>friend / amigo</b> y <b>kind / amable</b> en un cuento; hagan el gesto de cada palabra; practiquen «mi turno · tu turno». Cualquier modo de respuesta vale.`:`Find <b>friend / amigo</b> and <b>kind / amable</b> in a story; do each word’s gesture; practise “my turn · your turn”. Any response mode counts.`}</p>

<script>
/* =============== STUDENT · the nine boxes as one child lives them =============== */
function applyKidA11y(k){if(!UI._own)UI._own={size:UI.size,contrast:UI.contrast,motion:UI.motion,big:UI.big,speak:UI.speak};const a=k.a11y||{};UI.size=a.size||'md';UI.contrast=!!a.contrast;UI.motion=!!a.motion;UI.big=!!a.big;UI.speak=!!a.speak;applyUI();if(a11yList(k).length)toast(t('a_applied').replace('{n}',k.name))}
function restoreA11y(){if(!UI._own)return;Object.assign(UI,UI._own);delete UI._own;applyUI()}

function bi(es,en){const A=ADAPT[S.learner.kid];const first=A.first==='en'?[en,es]:[es,en];return `<div class="prompt">${first[0]}</div><div class="bi">${first[1]}</div>`}
function sayBtn(txt){const A=ADAPT[S.learner.kid];return `<button class="speak" data-act="say" data-v="${esc(txt)}" data-l="${A.first}" data-force="1">🔊 ${UI.lang==='es'?'Escuchar':'Listen'}</button>`}

function whyBox(txt){return `<div class="whybox">💡<div><b>${t('why_lbl')}:</b> ${txt}</div></div>`}

function choiceTask(cfg){/* cfg: {prompt es/en, visual, opts, item, why, aacLabel} */const ln=S.learner,A=ADAPT[ln.kid];let opts=cfg.opts;if(A.opts===2)opts=[opts.find(o=>o.ok),opts.find(o=>!o.ok)];
 const seedR=rng(hash(ln.kid+cfg.item));opts=[...opts].sort(()=>seedR()-.5);

  :`<div class="opts" style="--n:${opts.length}">${opts.map((o,i)=>`<button class="opt ${cls(o)}" data-act="choose" data-ok="${o.ok?1:0}" data-i="${i}">${o.p}<span class="lbl">${L(o.l)}</span></button>`).join('')}</div>`;
 const fb=ln.fb==='ok'?`<div class="fb" style="color:var(--ok)">${ln.tries>1||ln.hint||ln.model?t('l_withhelp'):t('l_good')} 🎉</div>`:ln.fb==='no'?`<div class="fb" style="color:var(--gold)">${t('l_try')}</div>`:'<div class="fb"></div>';

 return `<div class="task">${cfg.visual?`<div class="visual">${cfg.visual}</div>`:''}${bi(cfg.es,cfg.en)}${sayBtn(A.first==='en'?cfg.en:cfg.es)}${A.timer&&ln.fb!=='ok'?`<div class="timer"><i id="tbar"></i></div>`:''}<div style="height:12px"></div>${grid}${fb}${help}</div>`}

function lBox(){return BOX[LSTEPS[S.learner.i][0]]}

function recordL(item,v){setR(S.learner.kid,item,v,'learner')}
function finishLearner(){KIDS.forEach(k=>{if(k.id!==S.learner.kid&&!k.live)simulateKid(k)});S.plan=null;save()}
function walk(){const b=lBox();return `<div class="walk">${BOXES.map(x=>`<span style="--bc:${x.c}" class="${x.id===b.id?'on':''} ${x.n<b.n?'done':''}" title="${L(x.t)}">${x.n}</span>`).join('')}</div><div class="row" style="justify-content:center;gap:8px;margin-bottom:6px"><span class="chip" style="background:${b.l};color:${b.c};font-size:.9em">${b.ic} ${b.n} · ${L(b.t)}</span></div>`}

function vStudent(){if(!S.learner)return vStudentPick();const ln=S.learner,k=KID[ln.kid],A=ADAPT[ln.kid],st=lStep(),es=UI.lang==='es';const prog=Math.round(100*ln.i/(LSTEPS.length-1));
 const head=`<div class="lbar">${av(k,'av')}<b>${k.name}</b><span class="chip gold">${L(k.tag)}</span><div class="progress"><i style="width:${prog}%"></i></div><button class="hbtn" data-act="mode-home">✕</button></div>`;

 else if(st==='feel'||st==='feel2')body=walk()+infoBtn(es?'La carita no se califica. Todas las respuestas valen.':'The face is not scored. Every answer counts.')+`<div class="task">${st==='feel2'?bi('¿Cómo te sientes ahora?','How do you feel now?'):bi('¿Cómo te sientes hoy?','How do you feel today?')}<div class="feelgrid">${FEELS.map((f,i)=>`<button class="opt ${S.feel[k.id]===i?'ok':''}" data-act="feel" data-v="${i}" style="min-height:120px;font-size:2.8em">${f.l}<span class="lbl">${f[UI.lang]}</span></button>`).join('')}</div><div class="helprow">${S.feel[k.id]!=null?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:''}</div></div>`;
 else if(st==='magnets'){const M=[['🫁',es?'Prepararnos':'Get ready'],['🔤',es?'Aprender palabras':'Learn words'],['📖',es?'Leer':'Read'],['💬',es?'Hacer oraciones':'Make sentences'],['🏃',es?'Movernos juntos':'Move together'],['⭐',es?'Cerrar':'Close']];body=walk()+infoBtn(A.schedule?(es?'Lucas sabe siempre qué viene: la agenda queda a la vista en toda la lección.':'Lucas always knows what comes next: the schedule stays visible for the whole lesson.'):(es?'Los imanes muestran el plan del día. Señalar o nombrar cada uno es participar.':'The magnets show the plan for the day. Pointing to or naming each one is participating.'))+`<div class="task">${bi('Hoy vamos a…','Today we will…')}<p class="bi">${t('s_tap_all')}</p><div class="magnets">${M.map((m,i)=>`<button class="magnet ${ln.mag.includes(i)?'on':''}" data-act="magnet" data-v="${i}"><span style="font-size:1.4em">${m[0]}</span>${m[1]}${ln.mag.includes(i)?'<span style="margin-left:auto;color:var(--green)">✓</span>':''}</button>`).join('')}</div><div class="helprow">${ln.mag.length>=6?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:''}</div></div>`}
 else if(st==='body')body=walk()+infoBtn(es?`«Cuerpo listo» se registra aparte de las palabras. ${A.quiet?'El rincón tranquilo también es participar.':A.seated?'La opción sentada se nombra en voz alta.':'Sentado o de pie, los dos valen.'}`:`“Ready body” is recorded apart from the words. ${A.quiet?'The quiet corner is participating too.':A.seated?'The seated option is named aloud.':'Seated or standing, both count.'}`)+`<div class="task">${bi('Cuerpo listo','Ready body')}<p class="bi">${t('l_body_s')}</p><button class="breath ${ln.breaths%2===1?'in':''}" data-act="breath">${ln.breaths>=3?'✓':ln.breaths+1}</button><div class="helprow">${ln.breaths>=3?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:`<button class="btn ghost" data-act="body-help">🤝 ${t('l_body_help')}</button>${A.quiet?`<button class="btn ghost" data-act="body-quiet">🧸 ${t('l_body_quiet')}</button>`:''}`}</div></div>`;
 else if(st==='snd')body=walk()+infoBtn(es?'Con la pista táctil cuenta «con apoyo»; sin ella, «sin apoyo».':'With the tactile cue it counts “with support”; without it, “independent”.')+choiceTask({es:`¿Con qué letra empieza <u>KIND</u>? /K/`,en:`Which letter starts <u>KIND</u>? /K/`,visual:'💛',opts:[{p:'K',l:{es:'/K/ garganta',en:'/K/ throat'},ok:true},{p:'T',l:{es:'/T/ nariz',en:'/T/ nose'}},{p:'F',l:{es:'/F/ pluma',en:'/F/ feather'}}],item:'snd',aacLabel:'/K/'});
 else if(st.startsWith('w_')){const w=WORDS.find(x=>'w_'+x.id===st);body=walk()+infoBtn(A.aac?(es?'Tocar el símbolo correcto en el tablero es una respuesta completa.':'Tapping the right symbol on the board is a full response.'):A.model?(es?'«Muéstrame primero» se registra como «con apoyo»; sin usarlo, «sin apoyo». 10 segundos, no 5.':'“Show me first” is recorded as “with support”; without it, “independent”. 10 seconds, not 5.'):A.opts===2?(es?'Dos opciones y una barra de tiempo. Menos estímulos.':'Two choices and a time bar. Fewer stimuli.'):(es?`Lo escucha en ${A.first==='es'?'español y luego en inglés':'inglés y luego el eco en español'}; responde en cualquier idioma.`:`Hears it in ${A.first==='es'?'Spanish, then English':'English, then the Spanish echo'}; may answer in either.`))+choiceTask({es:`Toca <u>${w.es}</u> · ${w.en}`,en:`Touch <u>${w.en}</u> · ${w.es}`,visual:w.pic,opts:w.opts,item:st,aacLabel:w.en})}
 else if(st==='book'){const p=BOOK[ln.bookpg];const last=ln.bookpg>=BOOK.length-1;body=walk()+infoBtn(es?'Cada página en inglés y luego en español. Antes de pasar: «¿Qué viene luego? What comes NEXT?»':'Each page in English, then Spanish. Before turning: “What comes NEXT?”')+`<div class="page"><div class="scene"><span class="pg">${L(p.pg)}</span>${bookScene(p)}</div><div class="txt">${A.first==='en'?`<div class="en">${p.en}</div><div class="es">${p.es}</div>`:`<div class="en">${p.es}</div><div class="es">${p.en}</div>`}</div></div><div class="helprow"><button class="btn plum" data-act="say" data-v="${esc((A.first==='en'?p.en:p.es).replace(/<[^>]+>/g,''))}" data-l="${A.first}" data-force="1">🔊</button><button class="btn gold" data-act="echo">🙌 ${t('l_echo')}</button>${last?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:`<button class="btn big" data-act="lbook">NEXT? →</button>`}</div>`}
 else if(st==='retell')body=walk()+infoBtn(es?'Recontar con imágenes. Señalar vale igual que decirlo.':'Retell with pictures. Pointing counts the same as saying it.')+choiceTask({es:'¿Qué pasó <u>primero</u>?',en:'What happened <u>FIRST</u>?',visual:'📖',opts:[{p:'🔴⚽',l:{es:'Pep patea',en:'Pep kicks'},ok:true},{p:'🌳❓',l:{es:'la bola se esconde',en:'the ball hides'}},{p:'🔍⚽',l:{es:'la encuentran',en:'they find it'}}],item:'retell',aacLabel:'FIRST'});
 else if(st==='word'){const modes=[['say','🗣️',t('m_say')],['sign','🤟',t('m_sign')],['aac','📱',t('m_aac')],['point','👉',t('m_point')]];body=walk()+infoBtn(es?'Hablar, seña, señalar o CAA son respuestas iguales. Se guarda el modo, no se penaliza.':'Speech, sign, pointing or AAC are equal responses. The mode is stored, never penalised.')+`<div class="task">${bi('We are… ¿Somos…?','We are… Somos…')}${ln.mode?`<div class="opts" style="--n:5">${WORDS.map(w=>`<button class="opt ${ln.fb==='ok'&&ln.wordPick===w.id?'ok':''}" data-act="pick-word" data-v="${w.id}" style="min-height:120px;font-size:2.4em">${w.pic}<span class="lbl">${w.en}<br>${w.es}</span></button>`).join('')}</div>${ln.fb==='ok'?`<div class="fb" style="color:var(--ok)">We are ${WORDS.find(w=>w.id===ln.wordPick).en}! 🎉</div>`:''}`:`<div class="row" style="justify-content:center">${modes.map(m=>`<button class="btn ${(m[0]==='aac'&&A.aac)||(m[0]==='say'&&!A.aac&&k.modes[0]==='speech')?'plum':'ghost'} big" data-act="mode" data-v="${m[0]}">${m[1]} ${m[2]}</button>`).join('')}</div>`}<div class="helprow">${ln.fb==='ok'?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:`<button class="btn ghost" data-act="lskip">${t('l_skip')}</button>`}</div></div>`}
 else if(st==='bk')body=walk()+infoBtn(es?'Conectar el cuento con la vida real. No hay respuesta incorrecta.':'Connect the story to real life. There is no wrong answer.')+`<div class="task"><div class="visual">🏫</div>${bi('¿Quién es un amigo o ayudante en nuestra escuela?','Who is a friend or helper in our school?')}<div class="opts" style="--n:4">${[['👩‍🏫',{es:'la maestra',en:'the teacher'}],['🧑‍🤝‍🧑',{es:'un compañero',en:'a classmate'}],['👩‍⚕️',{es:'la enfermera',en:'the nurse'}],['🧑‍🍳',{es:'quien sirve el almuerzo',en:'the lunch helper'}]].map(o=>`<button class="opt ${ln.fb==='ok'&&ln.bkPick===o[0]?'ok':''}" data-act="bk-pick" data-v="${o[0]}" style="min-height:120px;font-size:2.6em">${o[0]}<span class="lbl">${L(o[1])}</span></button>`).join('')}</div><div class="helprow">${ln.fb==='ok'?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:`<button class="btn ghost" data-act="lskip">${t('l_skip')}</button>`}</div></div>`;
 else if(st==='wings'){const seqs=[['r','READY',A.seated?L(WINGS[0].seated):L(WINGS[0].ready),'🧍'],['m','MOVE',L(WINGS[0].move),'🚶'],['s','STOP',L(WINGS[0].stop),'✋']];body=walk()+infoBtn(es?'Se registra si sigue Ready → Move → Stop, no cuánto se mueve. Sentado = de pie.':'What is recorded is following Ready → Move → Stop, not how much they move. Seated = standing.')+`<div class="task">${bi('Ready Your Wings · '+WINGS[0].name.es,'Ready Your Wings · '+WINGS[0].name.en)}<div class="seg" style="margin-bottom:8px"><button data-act="seated" data-v="1" class="${ln.seated?'on':''}">🪑 ${t('seated')}</button><button data-act="seated" data-v="0" class="${!ln.seated?'on':''}">🧍 ${t('standing')}</button></div><div class="seqbtns">${seqs.map((s,i)=>`<button class="seqbtn ${s[0]} ${ln.seq===i?'now':''} ${ln.seq>i?'did':''}" data-act="seq" data-v="${i}"><span>${s[3]}</span>${s[1]}<small style="font-size:.6em;font-weight:600">${s[2]}</small></button>`).join('')}</div><div class="helprow">${ln.seq>=3?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:`<button class="btn ghost" data-act="seq-model">👀 ${es?'Otra vez':'Again'}</button>`}</div></div>`}
 else if(st==='turn')body=walk()+infoBtn(es?'Señalar, decir o tocar valen igual. Con recordatorio: «con apoyo».':'Pointing, saying or tapping count the same. With a reminder: “with support”.')+`<div class="fn" style="margin-bottom:12px"><div class="pocket"><span class="lab">FIRST</span><span class="av" style="background:#E63946;width:56px;height:56px;border-radius:50%">Pep</span></div><div class="pocket"><span class="lab red">NEXT</span><span style="font-size:2.4em">❓</span></div></div>`+choiceTask({es:'¿Quién sigue? <u>Who is NEXT?</u>',en:'<u>Who is NEXT?</u> ¿Quién sigue?',opts:[{p:'🔺',l:{es:'Lily',en:'Lily'},ok:true},{p:'🔵',l:{es:'Bella',en:'Bella'}},{p:'⚽',l:{es:'la bola',en:'the ball'}}],item:'turn',aacLabel:'NEXT'});
 else if(st==='calm')body=walk()+infoBtn(es?'Cierre: respiración 4·2·4, caritas otra vez y la promesa con alas de ángel.':'Closing: 4·2·4 breathing, faces again and the pledge with Angel Wings.')+`<div class="task">${bi('Respira conmigo','Breathe with me')}<p class="bi">4 · 2 · 4</p><button class="breath ${ln.calm%2===1?'in':''}" data-act="calm">${ln.calm>=3?'✓':ln.calm+1}</button><div class="helprow">${ln.calm>=3?`<button class="btn big teal" data-act="lnext">${t('next_step')}</button>`:''}</div></div>`;
 else{const c=kidSummary(k.id);body=`<div class="card pad" style="text-align:center"><div class="pledge" style="margin-bottom:16px">🦋 ${t('s_pledge')}<br><small style="opacity:.85">Somos Parte. We Belong.</small></div><h1 style="margin:6px 0">${t('l_done')}</h1><p class="lead" style="margin:0 auto 14px">${t('l_done_s')}</p><div class="summary" style="text-align:left;margin-bottom:14px">${ITEMS.map(it=>{const v=getR(k.id,it.id);return `<div><b>${it.ic} ${L(it.lab)}</b><span class="chip ${v||'no'}" style="margin-top:4px">${v?ST_ICON[v]+' '+L(it.lv[v]):'—'}</span></div>`}).join('')}</div><p style="font-weight:700;margin-bottom:14px">✓ ${c.ok} · ◐ ${c.sup} · ○ ${c.no}</p><div class="row" style="justify-content:center"><button class="btn big" data-act="see-teacher" data-v="${k.id}">${t('see_teacher')}</button><button class="btn ghost" data-act="mode-home">${t('enter_as')}…</button></div></div>`}
 return `<div class="learn">${head}${body}</div>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;const ln=S.learner;
 switch(a){
  case 'lang':UI.lang=v;if(S.plan&&!Object.keys(S.edits).length)S.plan=genPlanBoxes();applyUI();render();break;
  case 'panel':document.getElementById('panel').classList.toggle('show');render();break;
  case 'size':UI.size=v;applyUI();renderPanel();break;
  case 'restart':if(window._rst&&Date.now()-window._rst<5000){window._rst=0;resetAll()}else{window._rst=Date.now();toast(UI.lang==='es'?'Toca otra vez para borrar las respuestas de este iPad.':'Tap again to clear this iPad’s responses.')}break;
  case 'enter':S.mode=v;if(v==='teacher')goTeacher('today');else if(v==='student'){S.learner=null;S.screen='student';render()}else{S.famKid=null;S.screen='family';render()}window.scrollTo(0,0);break;
  case 'signout':if(S.screen==='student')restoreA11y();S.mode=null;S.screen='login';render();window.scrollTo(0,0);break;
  case 'mode-home':modeHome();break;
  case 'tab':goTeacher(v);break;
  case 'child':S.recordId=v;S.recFrom={screen:S.screen,tab:S.tab};S.screen='child';render();window.scrollTo(0,0);break;
  case 'back-child':{const f=S.recFrom||{};if(f.screen==='teacher')goTeacher(f.tab);else{S.screen=f.screen||'teacher';render()}window.scrollTo(0,0);break}
  case 'present':enterPresent();break;
  case 'present-exit':exitPresent();break;
  case 'lens':S.lens=v;render();break;
  case 'kid-next':S.recordId=v;S.lens='next';render();window.scrollTo(0,0);break;
  case 'rec-b5':S.b5kid=v;goTeacher('screen');{const o=document.getElementById('ovl');o.dataset.kind='b5form';document.getElementById('ovl-body').innerHTML=vScreenForm(KID[v]||KIDS[0]);o.classList.add('show');o.scrollTop=0}break;
  case 'report':S.recordId=v;S.repFrom=S.screen;S.screen='report';render();window.scrollTo(0,0);break;
  case 'back-report':S.screen=S.repFrom==='family'?'family':'child';render();window.scrollTo(0,0);break;
  case 'print':try{window.print()}catch(e){}toast(t('rep_print_hint'));break;
  case 'toggle-dd':S.dd[v]=!S.dd[v];save();const ddEl=b.closest('.dd');if(ddEl)ddEl.classList.toggle('open');else render();break;
  case 'content':openContent(v);break;
  case 'ovl-close':document.getElementById('ovl').classList.remove('show');break;
  case 'book':BOOKPG=+v;refreshContent();break;
  case 'bookpg':BOOKPG=Math.max(0,Math.min(BOOK.length-1,+v));render();break;
  case 'fn-next':FN=[FN[1],FN[1]+1];refreshContent();break;
  case 'say':speakForce(b.dataset.v,b.dataset.l);break;
  case 'start':if(!anyRecorded()){simulateAll();toast(t('fill_done'))}if(S.done){S.box=0;S.done=false;S.boxDone={}}S.liveView='board';goTeacher('live');break;
  case 'fill':simulateAll();toast(t('fill_done'));render();break;
  case 'box':S.box=Math.max(0,Math.min(8,+v));render();window.scrollTo(0,0);break;
  case 'openbox':flipTo(()=>{S.box=Math.max(0,Math.min(8,+v));S.liveView='box'});break;
  case 'toboard':flipTo(()=>{S.liveView='board'});break;
  case 'donebox':S.boxDone[BOXES[S.box].id]=true;S.box=Math.min(8,S.box+1);flipTo(()=>{S.liveView='board'});break;
  case 'b5tog':S.b5lines=S.b5lines||{bk:true,ol:true,pa:true,ak:true,cp:true};S.b5lines[v]=!S.b5lines[v];if(!Object.values(S.b5lines).some(Boolean))S.b5lines[v]=true;render();break;
  case 'cycle':{const cur=getR(b.dataset.k,b.dataset.i);const nx=cur==null?'ok':cur==='ok'?'sup':cur==='sup'?'no':'ok';setR(b.dataset.k,b.dataset.i,nx,'teacher');S.plan=null;render();break}
  case 'feel-count':{const next=KIDS.find(k=>S.feel[k.id]==null);if(next){S.feel[next.id]=+v;toast(`${next.name} · ${FEELS[+v].l}`)}else{KIDS.forEach(k=>{if(S.feel[k.id]===+v)S.feel[k.id]=null});}save();render();break}
  case 'finish':S.done=true;S.plan=null;goTeacher('tomorrow');break;
  case 'teach-tomorrow':if(!anyRecorded()){simulateAll();toast(t('fill_done'))}S.plan=genPlanBoxes();S.edits={};S.savedPlan=false;goTeacher('tomorrow');break;
  case 'edit':S.editing=!S.editing;render();break;
  case 'saveplan':S.savedPlan=true;save();toast(t('saved'));render();break;
  case 'add-open':S.addOpen=true;render();setTimeout(()=>document.getElementById('addName')?.focus(),50);break;
  case 'add-close':S.addOpen=false;render();break;
  case 'add-save':{const n=(document.getElementById('addName')?.value||'').trim();if(!n){toast(t('name_ph'));break}addKid(n,document.getElementById('addAge').value,document.getElementById('addHome').value,document.getElementById('addMode').value);S.addOpen=false;render();break}
  /* Big 5 */
  case 'b5pick':S.b5kid=v;render();break;
  case 'b5open-pick':{S.b5pickMode=v;const o=document.getElementById('ovl');document.getElementById('ovl-body').innerHTML=`<h2 style="margin-bottom:12px">${t('pick_kid')}</h2><div class="pickgrid">${KIDS.map(k=>`<button class="role" style="grid-template-columns:44px 1fr auto;min-height:72px;padding:12px 14px" data-act="b5go" data-v="${k.id}"><span class="ic" style="background:${k.color};width:44px;height:44px;border-radius:50%;font-size:1.1em">${k.name[0]}</span><span><b style="font-size:1.05em">${k.name}</b><small>${L(k.tag)}</small></span><span class="go">→</span></button>`).join('')}</div>`;o.dataset.kind='pick';o.classList.add('show');break}
  case 'b5go':document.getElementById('ovl').classList.remove('show');S.b5kid=v;S.b5picked=true;S.screen='b5ph';S.mode='teacher';render();window.scrollTo(0,0);break;
  case 'openboard':S.box=+v;S.liveView='board';if(!anyRecorded()){simulateAll()}goTeacher('live');break;
  case 'b5form':{const o=document.getElementById('ovl');o.dataset.kind='b5form';document.getElementById('ovl-body').innerHTML=vScreenForm(KID[S.b5kid]||KIDS[0]);o.classList.add('show');o.scrollTop=0;break}
  case 'b5form-close':document.getElementById('ovl').classList.remove('show');break;
  case 'b5kid':S.b5kid=v||'valentina';render();break;
  case 'class-report':S.screen='classreport';S.mode='teacher';render();window.scrollTo(0,0);break;
  case 'all-reports':S.screen='allreports';S.mode='teacher';render();window.scrollTo(0,0);break;
  case 'gfilter':S.gfilter=v||null;render();break;
  case 'rdetail':S.rdetail=!S.rdetail;render();break;
  case 'sort':{const cur=S.sort||{k:'name',d:1};S.sort=cur.k===v?{k:v,d:-cur.d}:{k:v,d:['name','circ','resp'].includes(v)?1:-1};render();break}
  case 'b5open':S.b5kid=v;S.b5view='progress';goTeacher('screen');break;
  case 'b5cp':S.b5cp=v;render();break;
  case 'b5f':{const f=b.dataset.f;const val=f==='s'?+v:v;const cur=getB5(b.dataset.k,b.dataset.i,S.b5cp)||{};setB5(b.dataset.k,b.dataset.i,{[f]:cur[f]===val&&f!=='s'?null:val});S.plan=null;render();break}
  case 'b5quick':{e.stopPropagation();SITEMS.filter(i=>i.d===v).forEach(i=>setB5(b.dataset.k,i.id,{s:2,sup:'I',p:'full'}));S.dd['sd-'+v]=true;S.plan=null;render();break}
  case 'b5expand':SDOM.forEach(d=>S.dd['sd-'+d.k]=v==='1');save();render();break;
  case 'record':S.recordId=v;S.recFrom={screen:'teacher',tab:'screen'};S.screen='child';render();window.scrollTo(0,0);break;
  /* student */
  case 'go-learner':startLearner(v);break;
  case 'lnext':lNext();break;
  case 'greet':ln.greet=v;render();break;
  case 'magnet':if(!ln.mag.includes(+v))ln.mag.push(+v);render();break;
  case 'feel':S.feel[ln.kid]=+v;save();render();break;
  case 'breath':ln.breaths++;if(ln.breaths>=3)recordL('reg_body',ln.helped?'sup':'ok');render();break;
  case 'body-help':ln.helped=true;ln.breaths=3;recordL('reg_body','sup');render();break;
  case 'body-quiet':ln.helped=true;ln.breaths=3;recordL('reg_body','sup');toast(UI.lang==='es'?'Rincón tranquilo · 1 min':'Quiet corner · 1 min');render();break;
  case 'calm':ln.calm++;render();break;
  case 'choose':{if(ln.fb==='ok')break;ln.tries++;const item=lStep();if(b.dataset.ok==='1'){ln.fb='ok';recordL(item,(ln.tries>1||ln.hint||ln.model)?'sup':'ok')}else{ln.fb='no';if(ln.tries>=2){recordL(item,'no');ln.fb=null;toast(UI.lang==='es'?'Hoy no, y está bien.':'Not today, and that is okay.');lNext();break}}render();break}
  case 'hint':ln.hint=true;render();break;
  case 'model':ln.model=true;render();break;
  case 'lskip':recordL(lStep(),'no');lNext();break;
  case 'lbook':ln.bookpg=Math.min(BOOK.length-1,ln.bookpg+1);render();window.scrollTo(0,0);break;
  case 'echo':toast(t('l_echo'));speakForce('We are friends! ¡Somos amigos!','en');break;
  case 'seated':ln.seated=v==='1';render();break;
  case 'seq':{if(+v!==ln.seq)break;ln.seq++;if(ln.seq>=3)recordL('wings',ln.seqModel?'sup':'ok');render();break}
  case 'seq-model':ln.seqModel=true;ln.seq=0;render();break;
  case 'mode':ln.mode=v;render();break;
  case 'pick-word':ln.wordPick=v;ln.fb='ok';recordL('word','ok');render();break;
  case 'bk-pick':ln.bkPick=v;ln.fb='ok';recordL('bk','ok');render();break;
  case 'see-teacher':restoreA11y();S.done=true;S.mode='teacher';S.recordId=v;S.recFrom={screen:'teacher',tab:'roster'};S.lens='lit';S.screen='child';render();window.scrollTo(0,0);break;
  /* family */
  case 'fam-pick':S.famKid=v;render();window.scrollTo(0,0);break;
  case 'fam-back':S.famKid=null;render();break;
 }});
document.addEventListener('change',e=>{const i=e.target.closest('[data-act=tog]');if(i){UI[i.dataset.v]=i.checked;if(i.dataset.v==='extras'&&!i.checked){UI.lang='en';if(S.mode&&S.mode!=='teacher'){if(S.screen==='student')restoreA11y();S.mode=null;S.screen='login'}}applyUI();if(i.dataset.v==='extras'){render();renderPanel();return}if(i.dataset.v==='speak'&&i.checked)speakForce(UI.lang==='es'?'Lectura en voz alta activada':'Read aloud on',UI.lang)}});
document.addEventListener('input',e=>{const rq=e.target.closest('input#rq');if(rq){S.q=rq.value;const pos=rq.selectionStart;render();const n=document.getElementById('rq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}const ta=e.target.closest('textarea[data-edit]');if(ta){S.edits[ta.dataset.edit]=ta.value;save()}const sn=e.target.closest('input.snote');if(sn){setB5(sn.dataset.k,sn.dataset.note,{n:sn.value})}});
document.getElementById('ovl').addEventListener('click',e=>{if(e.target.id==='ovl')e.target.classList.remove('show')});
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='dreams-ready'){window._boardOK=true;const fb=document.getElementById('boardfb');if(fb)fb.style.display='none';const fr=document.getElementById('boardfr');if(fr)fr.style.visibility='visible';}else if(d.type==='dreams-esc'){exitPresent()}else if(d.type==='dreams-box'&&S.screen==='teacher'&&S.tab==='live'){exitPresent();const n=Math.max(1,Math.min(9,+d.n||1));flipTo(()=>{S.box=n-1;S.liveView='box'})}});

/* ---- present mode: board fills the screen; keyboard works like the original board ---- */
function enterPresent(){const fr=document.getElementById('boardfr');if(!fr||S.screen!=='teacher'||S.tab!=='live'||S.liveView!=='board')return;document.body.classList.add('present');window._present=true;try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen)&&(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>{})}catch(e){}setTimeout(()=>{try{fr.focus();fr.contentWindow.focus()}catch(e){}},80)}
function exitPresent(){if(!window._present)return;window._present=false;document.body.classList.remove('present');try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&window._present)exitPresent()});
document.addEventListener('keydown',e=>{if(!window._present)return;if(e.key==='Escape'){exitPresent();return}const fr=document.getElementById('boardfr');if(!fr||!fr.contentWindow)return;if(e.metaKey||e.ctrlKey||e.altKey)return;e.preventDefault();try{fr.contentWindow.postMessage({type:'dreams-key',key:e.key,repeat:e.repeat},'*')}catch(err){}},true);
function boardSync(){const fr=document.getElementById('boardfr');if(fr&&fr.contentWindow){try{fr.contentWindow.postMessage({type:'dreams-goto',n:S.box+1},'*')}catch(e){}}}
/* boot */
load();restoreKids();if(/extras/.test(location.hash+location.search))UI.extras=true;if(!UI.extras){UI.lang='en';if(S.mode&&S.mode!=='teacher'){S.mode=null;S.screen='login'}}if(!S.mode)S.screen='login';applyUI();render();
</script>
</body></html>
